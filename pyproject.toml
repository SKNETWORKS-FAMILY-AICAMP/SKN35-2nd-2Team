[project]
name = "steam-churn"
version = "0.1.0"
description = "스팀 리뷰 기반 유저 이탈 예측"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "shap",
    "matplotlib",
    "joblib",
    "sentence-transformers",
    "ipykernel",
    "streamlit>=1.62.0",
    "plotly>=7.0.0",
    "autogluon-tabular>=1.6.1",
    "autogluon-multimodal>=1.6.1",
]

[tool.uv]
package = false
