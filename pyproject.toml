[project]
name = "steam-churn"
version = "0.1.0"
description = "스팀 리뷰 기반 유저 이탈 예측"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "shap",
    "matplotlib",
    "joblib",
    "sentence-transformers",
    "ipykernel",
    "streamlit>=1.62.0",
    "plotly>=7.0.0",
    "imbalanced-learn>=0.14.2",
    "autogluon-tabular>=1.6.1",
    "autogluon-multimodal>=1.6.1",
    "pydeck>=0.9.3",
    "streamlit-autorefresh>=1.0.1",
    # DB (화면 2 퀴즈 기록 · TiDB = MySQL 호환)
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
]

[tool.uv]
package = false
